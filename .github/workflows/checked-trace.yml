name: checked-trace-certificates

on:
  pull_request:
    paths:
      - 'ControlStack/Core/CheckedTrace.lean'
      - '.github/workflows/checked-trace.yml'
      - 'ControlStack.lean'
      - 'scenarios/SC-08/harness/reconcile.py'
      - 'tools/test_sc08_reconcile.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sc08-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed hash and multiset mutation checks
        run: python3 tools/test_sc08_reconcile.py
      - name: Check source-only generated registry and statement catalog
        run: |
          python3 tools/build_registry.py --check
          python3 tools/build_statement_catalog.py --check
  lean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Kernel check all replay soundness corollaries
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build ControlStack.Core.CheckedTrace
