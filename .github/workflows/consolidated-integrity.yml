name: consolidated-integrity
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject changes to frozen evidence, preregistration and EgressGate.lean
        shell: bash
        run: |
          set -euo pipefail
          # Full history: the frozen prereg's first-addition commit now lives in main, and a --depth=1 fetch would make it a shallow boundary.
          git fetch origin main
          # The handoff explicitly authorizes one NEW prereg; existing files stay frozen.
          # Its exact bytes must match the first addition commit and every input hash.
          python3 tools/check_deployment_prereg.py --base origin/main
      - name: Regenerated theorem registry and normalized catalog consistent
        run: |
          python3 tools/build_registry.py --check
          python3 tools/build_statement_catalog.py --check
          python3 tools/build_lean_english_overview.py --check
      - name: Manifest, overview and assurance indexes consistent
        run: |
          python3 tools/build_status.py --check
          python3 tools/build_overview.py --check
          python3 tools/portfolio_ledger.py --check --no-lean
          python3 tools/check_scenarios.py --json > "$RUNNER_TEMP/scenario-lint.json"
          python3 assurance/check_manifests.py passed
  kernel-review:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Look up a previous green run on identical inputs (clean hosted runner)
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-kernel-review-${{ hashFiles('**/*.lean', '**/*.py', '**/*.json', '**/*.toml', '**/*.sh', 'lean-toolchain', '.github/workflows/consolidated-integrity.yml') }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED kernel-review - the same input hash passed on a clean GitHub-hosted runner before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Self-hosted - shared read-only Mathlib build and this runner's incremental build cache
        if: runner.environment == 'self-hosted' && steps.green.outputs.cache-hit != 'true'
        run: |
          mkdir -p .lake "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME"
          ln -sfn /opt/ci-shared/packages .lake/packages
          ln -sfn "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME" .lake/build
          avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          test "$avail" -ge 1500 || { echo "refusing to run: under 1.5 GB free on the runner disk"; exit 1; }
      - name: Install exact pinned Lean toolchain
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Cache pinned Lean dependency builds
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Kernel-check F6 and F8 candidate proof statements with no sorryAx
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then lake exe cache get; fi
          lake build ControlStack.GateComposition ControlStack.Scenarios.SC25Audit ControlStack.Scenarios.SC26Transaction
          lake env lean reviews/family-strengthening/F6F8.lean | tee "$RUNNER_TEMP/f6f8-axioms.txt"
          lake env lean reviews/statement-fidelity-2026-10-09/Counterexamples.lean | tee "$RUNNER_TEMP/scope-axioms.txt"
          grep -F 'CorrelatedMonitor.joint_misses_le_each' "$RUNNER_TEMP/f6f8-axioms.txt"
          grep -F 'GateComposition.shared_family_invariants' "$RUNNER_TEMP/f6f8-axioms.txt"
          grep -F 'ControlStack.SC26.sc26_safe' "$RUNNER_TEMP/scope-axioms.txt"
          if grep -h -E '(sorryAx|\bsorry\b)' "$RUNNER_TEMP/f6f8-axioms.txt" "$RUNNER_TEMP/scope-axioms.txt"; then
            echo 'ERROR: unexpected unsafe proof axiom'
            exit 1
          fi
        if: steps.green.outputs.cache-hit != 'true'
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
