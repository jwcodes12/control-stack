name: deployment-release
# T8.3 release gate for the scoped R2 local-file slice.
# Live container stages cannot run here (offline rootfs, passwordless sudo and the box-local image are absent);
# they are reported SKIPPED and never counted as a pass. Run `cstack demo` on the supported host for them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fixture matrix, golden outputs, schemas and exit codes
        run: |
          python3 tools/test_deployment_slice.py
          python3 tools/test_deployment_release.py
          python3 tools/test_deployment_pins.py
          python3 tools/test_deployment_hardening.py
          python3 tools/build_deployment_fixtures.py --check
          python3 tools/build_deployment_golden.py --check
      - name: Monotonicity (520 seeded strict additions)
        run: python3 tools/check_deployment_monotonicity.py
      - name: Held-out sealed corpus regression (static)
        run: python3 tools/test_deployment_heldout.py
      - name: Archived real-container evidence replay
        run: |
          python3 tools/test_deployment_r2.py
          python3 tools/test_deployment_remediated.py
          python3 tools/test_deployment_attribution.py
          python3 tools/check_deployment_prereg.py
  full-build:
    # Every root import must build, but nothing else in `kernel` needs the whole project, so this runs in parallel with it.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Hash this job's inputs (tracked-file blob ids; milliseconds, unlike hashFiles over the workspace)
        id: inputs
        run: >
          echo "hash=$(git ls-files -s -- '*.lean' '*.py' '*.json' '*.toml' '*.sh' lean-toolchain '.github/workflows/deployment-release.yml' | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Look up a previous green run on identical inputs (clean hosted runner)
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-full-build-${{ steps.inputs.outputs.hash }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED full-build - the same input hash passed on a clean GitHub-hosted runner before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Self-hosted - shared read-only Mathlib build and this runner's incremental build cache
        if: runner.environment == 'self-hosted' && steps.green.outputs.cache-hit != 'true'
        run: |
          mkdir -p .lake "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME"
          ln -sfn /opt/ci-shared/packages .lake/packages
          ln -sfn "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME" .lake/build
          avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          test "$avail" -ge 1500 || { echo "refusing to run: under 1.5 GB free on the runner disk"; exit 1; }
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Cache pinned Lean dependency builds
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - run: lake exe cache get
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Full project Lean build (all root imports)
        run: lake build
        if: steps.green.outputs.cache-hit != 'true'
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
  kernel:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Hash this job's inputs (tracked-file blob ids; milliseconds, unlike hashFiles over the workspace)
        id: inputs
        run: >
          echo "hash=$(git ls-files -s -- '*.lean' '*.py' '*.json' '*.toml' '*.sh' lean-toolchain '.github/workflows/deployment-release.yml' | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Look up a previous green run on identical inputs (clean hosted runner)
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-kernel-${{ steps.inputs.outputs.hash }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED kernel - the same input hash passed on a clean GitHub-hosted runner before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Self-hosted - shared read-only Mathlib build and this runner's incremental build cache
        if: runner.environment == 'self-hosted' && steps.green.outputs.cache-hit != 'true'
        run: |
          mkdir -p .lake "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME"
          ln -sfn /opt/ci-shared/packages .lake/packages
          ln -sfn "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME" .lake/build
          avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          test "$avail" -ge 1500 || { echo "refusing to run: under 1.5 GB free on the runner disk"; exit 1; }
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Cache pinned Lean dependency builds
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - run: lake exe cache get
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - run: lake build ControlStack.Deployment.Contracts ControlStack.Deployment.R2Contracts ControlStack.Deployment.Witnesses ControlStack.Deployment.NamedContracts ControlStack.Deployment.ProvenanceWitnesses ControlStack.Scenarios.SC25Refinement ControlStack.Scenarios.SC25RefinementReuse
        if: steps.green.outputs.cache-hit != 'true'
      - name: Python/Lean differential (fixtures + 250 seeded mutations)
        run: python3 tools/check_deployment_subset_differential.py
        if: steps.green.outputs.cache-hit != 'true'
      - name: Contract witnesses and axiom report
        run: python3 tools/check_deployment_contract_witnesses.py
        if: steps.green.outputs.cache-hit != 'true'
      - name: T4.4 checked transcript replay (generated module, axioms, falsifying mutants)
        run: python3 tools/check_deployment_transcript.py
        if: steps.green.outputs.cache-hit != 'true'
      - name: Held-out sealed corpus in the kernel
        run: python3 tools/check_deployment_heldout.py --instantiate-known-code --output /tmp/heldout-static.json
        if: steps.green.outputs.cache-hit != 'true'
      - name: Held-out round 2 (hardened profile, post-fix; the pre-fix false CONDITIONAL is archived)
        run: python3 tools/check_deployment_heldout.py --corpus deployment/heldout/tier10 --fresh-rules --instantiate-known-code --output /tmp/heldout-round2.json
        if: steps.green.outputs.cache-hit != 'true'
      - name: Demo static stages; live stages must be reported SKIPPED, exit 3
        run: |
          # A per-job directory (the self-hosted runner's /tmp persists across jobs and `cstack demo` refuses an existing output directory).
          demo="$RUNNER_TEMP/demo"
          rm -rf "$demo"
          set +e
          python3 tools/cstack.py demo --output "$demo" --static-only
          code=$?
          set -e
          python3 - "$code" <<'PY'
          import json, os, sys
          s = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'demo', 'demo.json')))
          assert int(sys.argv[1]) == 3 and s['result'] == 'SKIPPED', (sys.argv[1], s['result'])
          static, live = s['stages'][:2], s['stages'][2:]
          assert all(x['status'] == 'PASS' for x in static), static
          assert all(x['status'] == 'SKIPPED' for x in live), live
          PY
          cat "$demo/DEMO.md" >> "$GITHUB_STEP_SUMMARY"
          echo '**Live container stages: SKIPPED on GitHub runners (not a pass).**' >> "$GITHUB_STEP_SUMMARY"
        if: steps.green.outputs.cache-hit != 'true'
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
  live-containers:
    # Requires the supported host: offline rootfs at /var/tmp/sc01-vm-assets/build-root, passwordless sudo, Docker.
    # GitHub-hosted runners have Docker but not the pinned offline rootfs; this job is therefore always skipped here.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/cstack.py demo --output /tmp/demo
