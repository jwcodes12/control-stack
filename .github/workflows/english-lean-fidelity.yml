name: english-lean-fidelity-kernel
on:
  push:
    branches: [fidelity-kernel-20261009]
    paths:
      - "reviews/fidelity-repro/**"
      - ".github/workflows/english-lean-fidelity.yml"
  pull_request:
    paths:
      - "reviews/fidelity-repro/**"
      - ".github/workflows/english-lean-fidelity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elaboration-and-countermodels:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hash this job's inputs (tracked-file blob ids; milliseconds, unlike hashFiles over the workspace)
        id: inputs
        run: >
          echo "hash=$(git ls-files -s -- '*.lean' '*.py' '*.json' '*.toml' '*.sh' lean-toolchain '.github/workflows/english-lean-fidelity.yml' | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Look up a previous green run on identical inputs
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-elaboration-and-countermodels-${{ steps.inputs.outputs.hash }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED elaboration-and-countermodels - the same input hash passed before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Self-hosted - shared read-only Mathlib build and this runner's incremental build cache
        if: runner.environment == 'self-hosted' && steps.green.outputs.cache-hit != 'true'
        run: |
          mkdir -p .lake "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME"
          ln -sfn /opt/ci-shared/packages .lake/packages
          ln -sfn "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME" .lake/build
          avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          test "$avail" -ge 1500 || { echo "refusing to run: under 1.5 GB free on the runner disk"; exit 1; }
      - name: Verify audit source pin
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 083874048518b68d754f0c392ad0cb84f01174ba^{commit}
          # Restore exactly the historical proof sources, keeping these new probes.
          # A future main branch is allowed to contain newer Lean modules.
          git restore --source 083874048518b68d754f0c392ad0cb84f01174ba --worktree -- ControlStack ControlStack.lean proofs ledger lakefile.lean lean-toolchain
          test -z "$(git diff --name-only 083874048518b68d754f0c392ad0cb84f01174ba -- ControlStack ControlStack.lean proofs ledger lakefile.lean lean-toolchain)"
          cat lean-toolchain
        if: steps.green.outputs.cache-hit != 'true'
      - name: Install pinned Lean through elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Fetch dependencies and build the unchanged source
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then lake exe cache get; fi
          lake build
        if: steps.green.outputs.cache-hit != 'true'
      - name: Elaborated theorem types and axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean reviews/fidelity-repro/Elaboration.lean 2>&1 | tee elaboration.log
        if: steps.green.outputs.cache-hit != 'true'
      - name: Compile minimal countermodels
        shell: bash
        run: |
          set -euo pipefail
          lake env lean reviews/fidelity-repro/Countermodels.lean 2>&1 | tee countermodels.log
          echo "ALL COUNTERMODEL PROOFS CHECKED"
        if: steps.green.outputs.cache-hit != 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ steps.green.outputs.cache-hit != 'true' && (always()) }}
        with:
          name: english-lean-fidelity-logs
          path: |
            elaboration.log
            countermodels.log
          if-no-files-found: ignore
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
