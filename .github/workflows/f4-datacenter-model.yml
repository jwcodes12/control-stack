name: f4-datacenter-model

on:
  pull_request:
    paths:
      - 'ControlStack/Families/F4/**'
      - 'ControlStack/Core/DatacenterRoots.lean'
      - 'tools/portfolio_ledger.py'
      - 'ASSURANCE-LEDGER.md'
      - '.github/workflows/f4-datacenter-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-generated:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 14 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate source-only review pages
        run: |
          python3 tools/build_statement_catalog.py
          python3 tools/build_results.py
      - name: Commit only reproducible generated pages to this PR branch
        run: |
          git add LEAN-STATEMENTS-NORMAL-FORM.md scenarios/SC-07/result.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate statement catalog and SC-07 result page'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
  generated-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast generated-file and manifest checks
        run: python3 tools/cstack.py check --fast
  lean-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Build F4 bound-nonce proofs and datacenter graph
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build ControlStack.Families.F4.SessionBoundNonce ControlStack.Core.DatacenterRoots
      - name: Check generated typed ledgers and scenario roots
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 tools/portfolio_ledger.py --check
          python3 tools/gen_trust_root.py --check
          python3 tools/cstack.py check --fast
