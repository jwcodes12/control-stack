name: f6-f8-concrete-review
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Look up a previous green run on identical inputs (clean hosted runner)
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-kernel-candidate-${{ hashFiles('**/*.lean', '**/*.py', '**/*.json', '**/*.toml', '**/*.sh', 'lean-toolchain', '.github/workflows/f6-f8-concrete-review.yml') }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED kernel-candidate - the same input hash passed on a clean GitHub-hosted runner before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Install pinned Lean toolchain
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        if: steps.green.outputs.cache-hit != 'true'
      - name: Cache pinned Lean dependency builds
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
        if: steps.green.outputs.cache-hit != 'true'
      - name: Build candidates, verify no sorry and inspect axioms
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build ControlStack.GateComposition
          lake env lean reviews/family-strengthening/RuntimeGates.lean | tee /tmp/runtime-gates-axioms.log
          if grep -E 'sorryAx|\[.*sorry.*\]' /tmp/runtime-gates-axioms.log; then exit 1; fi
        if: steps.green.outputs.cache-hit != 'true'
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
