name: f6-f8-concrete-review
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-candidate:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Hash this job's inputs (tracked-file blob ids; milliseconds, unlike hashFiles over the workspace)
        id: inputs
        run: >
          echo "hash=$(git ls-files -s -- '*.lean' '*.py' '*.json' '*.toml' '*.sh' lean-toolchain '.github/workflows/f6-f8-concrete-review.yml' | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Look up a previous green run on identical inputs (clean hosted runner)
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-kernel-candidate-${{ steps.inputs.outputs.hash }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED kernel-candidate - the same input hash passed on a clean GitHub-hosted runner before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Self-hosted - shared read-only Mathlib build and this runner's incremental build cache
        if: runner.environment == 'self-hosted' && steps.green.outputs.cache-hit != 'true'
        run: |
          mkdir -p .lake "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME"
          ln -sfn /opt/ci-shared/packages .lake/packages
          ln -sfn "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME" .lake/build
          avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          test "$avail" -ge 1500 || { echo "refusing to run: under 1.5 GB free on the runner disk"; exit 1; }
      - name: Install pinned Lean toolchain
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Cache pinned Lean dependency builds
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Build candidates, verify no sorry and inspect axioms
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then lake exe cache get; fi
          lake build ControlStack.GateComposition
          lake env lean reviews/family-strengthening/RuntimeGates.lean | tee /tmp/runtime-gates-axioms.log
          if grep -E 'sorryAx|\[.*sorry.*\]' /tmp/runtime-gates-axioms.log; then exit 1; fi
        if: steps.green.outputs.cache-hit != 'true'
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
