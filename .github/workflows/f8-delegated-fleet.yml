name: f8-delegated-fleet
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'reviews/family-strengthening/DelegatedFleet.lean'
      - 'trusted_stack/test_delegated_fleet.py'
      - 'docs/F8-DELEGATED-FLEET.md'
      - '.github/workflows/f8-delegated-fleet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-runtime:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Look up a previous green run on identical inputs
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-model-and-runtime-${{ hashFiles('**/*.lean', '**/*.py', '**/*.json', '**/*.toml', '**/*.sh', 'lean-toolchain', '.github/workflows/f8-delegated-fleet.yml') }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED model-and-runtime - the same input hash passed before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Self-hosted - shared read-only Mathlib build and this runner's incremental build cache
        if: runner.environment == 'self-hosted' && steps.green.outputs.cache-hit != 'true'
        run: |
          mkdir -p .lake "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME"
          ln -sfn /opt/ci-shared/packages .lake/packages
          ln -sfn "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME" .lake/build
          avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          test "$avail" -ge 1500 || { echo "refusing to run: under 1.5 GB free on the runner disk"; exit 1; }
      - name: Install pinned Lean
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Kernel-check shared-budget delegated fleet and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then lake exe cache get; fi
          lake env lean reviews/family-strengthening/DelegatedFleet.lean | tee "$RUNNER_TEMP/fleet-axioms.txt"
          grep -F "DelegatedFleet.global_budget_run' depends on axioms:" "$RUNNER_TEMP/fleet-axioms.txt"
          grep -F "DelegatedFleet.two_agent_positive' does not depend on any axioms" "$RUNNER_TEMP/fleet-axioms.txt"
          if grep -E 'sorryAx|\\bsorry\\b' "$RUNNER_TEMP/fleet-axioms.txt"; then
            exit 1
          fi
        if: steps.green.outputs.cache-hit != 'true'
      - name: Real SQLite delegated concurrent fault and HALT cases
        run: python3 -m unittest trusted_stack.test_delegated_fleet -v
        if: steps.green.outputs.cache-hit != 'true'
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
