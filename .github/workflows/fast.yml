name: fast-checks
on:
  push:
    branches-ignore:
      - lean-validation-run-20261008
  pull_request:
  workflow_dispatch:
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Banned tokens in proofs and ledger statements
        run: |
          ! grep -nE '\bsorry\b|\badmit\b|native_decide|implemented_by|@\[extern' proofs/*.lean ledger/*.lean ControlStack/*.lean ControlStack.lean
      - name: Data hashes match the preregistrations
        run: |
          (cd data/linuxarena && sha256sum -c SHA256SUMS)
          (cd data/redwood-leaderboard && sha256sum -c SHA256SUMS)
      - name: Re-run preregistered LinuxArena and LaStraj band analyses and compare
        run: |
          cd numerics
          cp linuxarena_split/summary.json /tmp/split_before.json
          python3 linuxarena_split.py > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/split_before.json')); b=json.load(open('linuxarena_split/summary.json'))
          assert a==b, "LinuxArena split certificate changed"
          print("LinuxArena split certificate reproduced")
          PY
          python3 lastraj_bands.py > /dev/null && git diff --exit-code lastraj_roc_bands.json
      - name: Replay policy fixture (decisions and documented bypasses)
        run: cd replay && python3 test_policy.py
      - name: Gateway adversarial tests and red-team bound
        run: cd gateway && python3 test_gateway.py
      - name: Assurance manifests are consistent (no category promotion)
        run: python3 assurance/check_manifests.py passed && git diff --stat assurance
  auditgate-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: trusted
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install the trusted schema (v1)
        run: PGPASSWORD=trusted psql -X -q -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f auditgate/setup_v1.sql
      - name: Audit-gate outcome matrix (every case must match its expected class)
        run: PGHOST=localhost PGPORT=5432 PGSUPW=trusted python3 auditgate/test_gate_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: auditgate-outcome-matrix, path: auditgate/outcome_matrix.json }
  lean-covert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Build and axiom-check the covert-channel theorems (mandatory)
        run: PATH=$HOME/.elan/bin:$PATH ci/covert/check.sh
  lean-vcvio:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Build the VCVio project (slow)
        run: ~/.elan/bin/lake build
