name: generated-assurance-indexes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
    paths: ['ControlStack/**', 'proofs/**', 'ledger/**', 'scenarios/**', 'registry/**', 'tools/build_registry.py', 'tools/build_status.py', '.github/workflows/generated-assurance-indexes.yml']
  pull_request:
    paths: ['ControlStack/**', 'proofs/**', 'ledger/**', 'scenarios/**', 'registry/**', 'tools/build_registry.py', 'tools/build_status.py', '.github/workflows/generated-assurance-indexes.yml']
  workflow_dispatch:
jobs:
  generated-index-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/build_registry.py --check
      - run: python3 tools/build_status.py --check
