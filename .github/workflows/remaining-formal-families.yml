name: remaining-formal-families
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'reviews/family-strengthening/Remaining.lean'
      - 'reviews/family-strengthening/EffectLifecycle.lean'
      - 'reviews/family-strengthening/DelegatedAdmission.lean'
      - 'tools/delegated_lean_difftest.py'
      - 'tools/joint_runtime_lean_difftest.py'
      - 'trusted_stack/**'
      - '.github/workflows/remaining-formal-families.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-remainder:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Hash this job's inputs (tracked-file blob ids; milliseconds, unlike hashFiles over the workspace)
        id: inputs
        run: >
          echo "hash=$(git ls-files -s -- '*.lean' '*.py' '*.json' '*.toml' '*.sh' lean-toolchain '.github/workflows/remaining-formal-families.yml' | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Look up a previous green run on identical inputs
        id: green
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: green-${{ github.workflow }}-lean-remainder-${{ steps.inputs.outputs.hash }}
      - name: Skipped, identical inputs already passed here
        if: steps.green.outputs.cache-hit == 'true'
        run: echo "SKIPPED lean-remainder - the same input hash passed before (${{ steps.green.outputs.cache-primary-key }})"
      - name: Self-hosted - shared read-only Mathlib build and this runner's incremental build cache
        if: runner.environment == 'self-hosted' && steps.green.outputs.cache-hit != 'true'
        run: |
          mkdir -p .lake "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME"
          ln -sfn /opt/ci-shared/packages .lake/packages
          ln -sfn "/var/lib/ghrunner/lake-build-cache-$RUNNER_NAME" .lake/build
          avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          test "$avail" -ge 1500 || { echo "refusing to run: under 1.5 GB free on the runner disk"; exit 1; }
      - name: Install pinned Lean toolchain
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        if: ${{ runner.environment == 'github-hosted' && (steps.green.outputs.cache-hit != 'true') }}
      - name: Kernel check F6 finite weighted histories and F8 concrete joint-budget transitions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then lake exe cache get; fi
          lake env lean reviews/family-strengthening/Remaining.lean | tee "$RUNNER_TEMP/remain-axioms.txt"
          lake env lean reviews/family-strengthening/EffectLifecycle.lean | tee "$RUNNER_TEMP/effect-lifecycle-axioms.txt"
          for claim in MonitorHistory.adaptive_miss_mass_le_budgets JointAdmission.budget_run JointAdmission.no_admissions_after_halt; do
            grep -F "$claim' depends on axioms:" "$RUNNER_TEMP/remain-axioms.txt"
          done
          grep -F "EffectLifecycle.budget_run' depends on axioms:" "$RUNNER_TEMP/effect-lifecycle-axioms.txt"
          grep -F "EffectLifecycle.unknown_effect_cannot_publish' depends on axioms:" "$RUNNER_TEMP/effect-lifecycle-axioms.txt"
          grep -F "EffectLifecycle.no_publications_in_halted_suffix' depends on axioms:" "$RUNNER_TEMP/effect-lifecycle-axioms.txt"
          grep -F "EffectLifecycle.halt_cannot_undo_published_unreceipted' depends on axioms:" "$RUNNER_TEMP/effect-lifecycle-axioms.txt"
          if grep -E 'sorryAx|\\bsorry\\b' "$RUNNER_TEMP/remain-axioms.txt" "$RUNNER_TEMP/effect-lifecycle-axioms.txt"; then
            echo "Found unexpected sorry proof axiom"
            exit 1
          fi
        if: steps.green.outputs.cache-hit != 'true'
      - name: Differential actual SQLite and filesystem trace vs Lean lifecycle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 tools/joint_runtime_lean_difftest.py
        if: steps.green.outputs.cache-hit != 'true'
      - name: Kernel check nonce-scoped delegation and actual SQLite bounded differential
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean reviews/family-strengthening/DelegatedAdmission.lean | tee "$RUNNER_TEMP/delegation-axioms.txt"
          grep -F "DelegatedAdmission.budget_run' depends on axioms:" "$RUNNER_TEMP/delegation-axioms.txt"
          grep -F "DelegatedAdmission.delegated_positive_witness' does not depend on any axioms" "$RUNNER_TEMP/delegation-axioms.txt"
          if grep -E 'sorryAx|\\bsorry\\b' "$RUNNER_TEMP/delegation-axioms.txt"; then
            exit 1
          fi
          python3 tools/delegated_lean_difftest.py
        if: steps.green.outputs.cache-hit != 'true'
      - name: Record this input hash as green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .ci-green && echo ok > .ci-green/ok
      - name: Save the green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
