name: sc06-oneuse-model

on:
  pull_request:
    paths:
      - 'ControlStack/Scenarios/SC06OneUse.lean'
      - '.github/workflows/sc06-oneuse-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Verify SC-06 context-ID / one-use invariant
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build ControlStack.Scenarios.SC06OneUse
