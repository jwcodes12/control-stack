name: sc10-refinement-kernel

on:
  pull_request:
    paths:
      - 'ControlStack/Scenarios/SC10Refinement.lean'
      - 'ControlStack/Scenarios/SC10Policy.lean'
      - '.github/workflows/sc10-refinement-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Kernel-check SC-10 event simulation and control
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build ControlStack.Scenarios.SC10Refinement
