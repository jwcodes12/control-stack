name: scenario-metadata
on:
  push:
    paths: ['scenarios/**', 'tools/check_scenario.py', 'tests/test_scenarios.py', '.github/workflows/scenario-metadata.yml']
  pull_request:
    paths: ['scenarios/**', 'tools/check_scenario.py', 'tests/test_scenarios.py', '.github/workflows/scenario-metadata.yml']
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/check_scenario.py --all --lint
      - run: python3 -m unittest discover -s tests -p 'test_scenarios.py'
