name: trusted-broker-disconnect
on:
  pull_request:
    paths:
      - 'trusted_stack/server.py'
      - 'trusted_stack/controller.py'
      - 'tools/test_trusted_stack_broker.py'
      - '.github/workflows/trusted-broker-disconnect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-peer-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit regressions
        run: python3 -m unittest discover -s trusted_stack -p 'test_*.py' -v
      - name: Independent UIDs, dropped acknowledgments, replay and HALT
        run: sudo -n python3 tools/test_trusted_stack_broker.py
