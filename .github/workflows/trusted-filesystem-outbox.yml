name: trusted-filesystem-outbox
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Filesystem publication and existing trusted stack regressions
        run: |
          python3 -m unittest trusted_stack.test_publish_effect -v
          python3 -m unittest discover -s trusted_stack -p 'test_*.py' -v
      - name: Immutable inputs and EgressGate unchanged
        run: |
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- ControlStack/EgressGate.lean
          test -z "$(git diff --name-only origin/main...HEAD -- 'scenarios/*/evidence/**' 'gateway/vm/receipts/**' 'experiments/*/evidence/**')"
