# Mathlib project used to check the ledger proofs (proofs/<CID>.lean) against the frozen statements
# (ledger/<CAMPAIGN>.lean). Pinned to the toolchain and Mathlib revision of the original gate:
# Lean v4.35.0-rc3, Mathlib v4.35.0-rc3 (commit c55e6e786f49471c72fbddbec5415808896aec1e, see lake-manifest.json).
# There are no Lean sources here: check.py assembles one file per CID and runs `lake env lean` on it.
name = "LedgerCheck"
version = "0.1.0"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"
